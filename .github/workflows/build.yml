name: Build and Test Project

on:
  push:
    branches:
      - "dev"
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+"
    paths-ignore:
      - "assets/**"
      - "LICENSE"
      - "**/*.md"
  pull_request:
    branches:
      - "main"
      - "dev"
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  DOTNET_VERSION: "10.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, name: linux, arch: x64 }
          # - { os: ubuntu-24.04-arm, name: linux, arch: arm64 }
          - { os: windows-latest, name: win, arch: x64 }
          # - { os: windows-11-arm, name: win, arch: arm64 }

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Project
        run: |
          dotnet publish

      - name: Test Project
        run: |
          dotnet test -c Release --no-build --report-trx

      - name: List Output Directory
        run: |
          ls -la artifacts/output

      - name: Create Archive
        working-directory: artifacts/output
        run: |
          7z a -tzip "$GITHUB_WORKSPACE/Euterpe-${{matrix.platform.name}}-${{ matrix.platform.arch }}.zip" *

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: Euterpe-${{ matrix.platform.name }}-${{ matrix.platform.arch }}.zip
          archive: false
