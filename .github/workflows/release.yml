name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }}-${{ matrix.platform.arch }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {os: ubuntu-latest, name: linux, arch: x64}
          - {os: windows-latest, name: win, arch: x64,}

    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build --report-trx

      - name: Publish
        run: dotnet publish -c Release

      - name: Create archive
        working-directory: artifacts/output
        run: 7z a -tzip "$GITHUB_WORKSPACE/Euterpe-${{ matrix.platform.name }}-${{ matrix.platform.arch }}.zip" *

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform.name }}-${{ matrix.platform.arch }}
          path: Euterpe-${{ matrix.platform.name }}-${{ matrix.platform.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download zips
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: ./dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*.zip

  distribute:
    name: Publish to Euterpe Distribution
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download zips
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: ./dist
          merge-multiple: true

      - name: Upload to Euterpe Distribution
        env:
          EUTERPE_API_KEY: ${{ secrets.EUTERPE_API_KEY }}
          VERSION: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          shopt -s nullglob
          for zip in dist/*.zip; do
            slug=$(basename "$zip" .zip); slug=${slug#Euterpe-}
            echo "uploading $slug v$VERSION ($zip)"
            curl --fail-with-body -sS -X POST \
              "https://euterpe-org.com/api/workspace/distribution/upload" \
              -H "Authorization: Bearer $EUTERPE_API_KEY" \
              -H "X-Request-Id: $(cat /proc/sys/kernel/random/uuid)" \
              -F "bucket=app-releases" \
              -F "slug=$slug" \
              -F "version=$VERSION" \
              -F "is_prerelease=$PRERELEASE" \
              -F "file=@$zip;type=application/zip"
            echo
          done