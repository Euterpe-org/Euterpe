name: Feature Request
description: Suggest a new feature for Euterpe
title: "[Feature Request]: "
labels: "enhancement"
body:
  - type: textarea
    id: introduction
    attributes:
      label: Brief Introduction
      placeholder: Briefly describe the functions you want to add
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: Details
      placeholder: More details like method parameters or what specifically the variables could do
    validations:
      required: true
